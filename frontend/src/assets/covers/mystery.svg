<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e5e9"/>
      <stop offset="1" stop-color="#d2ccd6"/>
    </linearGradient>
    <pattern id="mhatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#a99cb0" stroke-width="1" opacity="0.5"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#a99cb0" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="240" height="300" fill="url(#mbg)"/>
  <rect width="240" height="300" fill="url(#mhatch)"/>
  <rect x="16" y="14" width="8" height="272" fill="#4d3d64" opacity="0.85"/>
